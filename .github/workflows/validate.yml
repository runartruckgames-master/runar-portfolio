name: Portfolio validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and inline editor scripts
        run: |
          node --check examples.js
          node --check portrait-display.js
          node --check published-content.js
          node --check photo-editor.js
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm');
          for(const file of ['studio.html','index.html','preview.html']){
            const html=fs.readFileSync(file,'utf8');
            for(const [i,match] of [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].entries()){
              if(match[1].trim())new vm.Script(match[1],{filename:file+'#script-'+i});
            }
          }
          NODE
      - name: Check portfolio markup and editor wiring
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('studio.html','utf8');
          const ids=[...html.matchAll(/\bid="([^"]+)"/g)].map(m=>m[1]);
          const duplicates=ids.filter((id,i)=>ids.indexOf(id)!==i);
          if(duplicates.length)throw Error('Duplicate element IDs: '+[...new Set(duplicates)].join(', '));
          for(const match of html.matchAll(/getElementById\("([^"]+)"\)/g)){
            if(!ids.includes(match[1]))throw Error('Missing studio element: '+match[1]);
          }
          const site=fs.readFileSync('index.html','utf8');
          for(const file of ['examples.js','portrait-display.js','published-content.js']){
            if(!site.includes('src="'+file+'"'))throw Error('Missing public script '+file);
          }
          if(!site.includes('id="profile-preview"'))throw Error('Missing portrait target');
          NODE
      - name: Security boundaries and secret exposure checks
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const publicFiles=['index.html','examples.js','refresh.css','portrait-display.js','published-content.js','preview.html'];
          for(const file of publicFiles){
            const source=fs.readFileSync(file,'utf8');
            if(/(?:github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|gho_[A-Za-z0-9]{20,}|ghu_[A-Za-z0-9]{20,}|ghs_[A-Za-z0-9]{20,})/.test(source))throw Error('Potential GitHub credential in '+file);
          }
          const homepage=fs.readFileSync('index.html','utf8');
          if(/href=["'][^"']*(?:studio\\.html|preview\\.html)/i.test(homepage))throw Error('Public homepage links to editor');
          const editor=fs.readFileSync('studio.html','utf8');
          if(!/noindex,nofollow/.test(editor))throw Error('Editor must not be indexed');
          if(/localStorage\\.setItem\\([^)]*(?:token|password|secret)/i.test(editor))throw Error('Do not store credentials in browser storage');
          NODE
      - name: Validate published content
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const site=JSON.parse(fs.readFileSync('site-content.json','utf8'));
          const video=JSON.parse(fs.readFileSync('video-sources.json','utf8'));
          if(site.version!==1||video.version!==1)throw Error('Unsupported configuration version');
          for(const field of ['lead','about','contact'])if(typeof site[field]!=='string')throw Error('Invalid '+field);
          if(!site.projects||typeof site.projects!=='object'||Array.isArray(site.projects))throw Error('Invalid projects');
          for(const [field,max] of [['lead',600],['about',1500],['contact',350]]){if(!site[field].trim()||site[field].length>max)throw Error('Published '+field+' exceeds editor constraints')}
          for(const [name,description] of Object.entries(site.projects)){if(typeof description!=='string'||description.length>350)throw Error('Invalid project description: '+name)}
          if(typeof site.profilePhoto!=='string'||(site.profilePhoto&&!/^assets\/[a-zA-Z0-9_.-]+\.(jpg|jpeg|png|webp)$/.test(site.profilePhoto)))throw Error('Invalid profile photo path');
          if(site.profilePhoto&&!fs.existsSync(site.profilePhoto))throw Error('Published profile photo missing: '+site.profilePhoto);
          if(!video.sources||typeof video.sources!=='object'||Array.isArray(video.sources))throw Error('Invalid video sources');
          for(const [key,path] of Object.entries(video.sources)){
            if(!['tiny-workers','birthday','magic-world'].includes(key)||typeof path!=='string'||!/^assets\/videos\/[a-z0-9_-]+\.(mp4|webm)$/.test(path))throw Error('Invalid video source: '+key);
            if(!fs.existsSync(path))throw Error('Video file missing: '+path);
          }
          NODE
