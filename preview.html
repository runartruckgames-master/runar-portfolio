<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Предпросмотр портфолио</title><style>*{box-sizing:border-box}body{margin:0;background:#292631;color:#f5f0f5;font:15px system-ui}header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 22px;border-bottom:1px solid #514a60}h1{font-size:17px;margin:0 auto 0 0}button,a{border:1px solid #817396;border-radius:9px;background:#42394f;color:#fff;padding:9px 13px;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#a28ac7;color:#191420}main{height:calc(100dvh - 72px);display:flex;justify-content:center;align-items:stretch;padding:18px;overflow:auto}.screen{width:100%;height:100%;background:white;border:7px solid #514a60;border-radius:18px;overflow:hidden;box-shadow:0 14px 50px #0006;transition:width .2s}.screen iframe{width:100%;height:100%;border:0;background:#f8f5f0}.note{font-size:12px;color:#c5bacd}@media(max-width:650px){header{gap:7px;padding:10px}main{padding:8px;height:calc(100dvh - 130px)}button,a{padding:8px}h1{width:100%;font-size:15px}}</style></head><body><header><h1>Предпросмотр портфолио</h1><button data-width="100%" aria-pressed="true">ПК</button><button data-width="768px" aria-pressed="false">Планшет</button><button data-width="390px" aria-pressed="false">Смартфон</button><button data-width="320px" aria-pressed="false">Маленький экран</button><a href="./" target="_blank" rel="noopener">Открыть сайт</a><span class="note">Просмотр без редактирования</span></header><main><div class="screen" id="screen"><iframe src="./" title="Портфолио, режим посетителя"></iframe></div></main><script>const screen=document.getElementById("screen");const viewport=document.querySelector("main");document.querySelectorAll("[data-width]").forEach(b=>b.addEventListener("click",()=>{screen.style.width=b.dataset.width;viewport.scrollLeft=0;document.querySelectorAll("[data-width]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)))}));</script></body></html>
